<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>بازی ۳بعدی غمگین</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050816;
      color: white;
    }
    body {
      position: relative;
    }
    #ui {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 14px 16px;
      border-radius: 16px;
      backdrop-filter: blur(8px);
      min-width: 220px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.25);
    }
    #ui h2 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    #ui div {
      margin-top: 6px;
      font-size: 14px;
      color: #e2e8f0;
    }
    button {
      margin-top: 10px;
      width: 100%;
      border: none;
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      color: white;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    #help {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 20;
      background: rgba(0,0,0,0.35);
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.8;
      max-width: 300px;
      border: 1px solid rgba(255,255,255,0.1);
      color: #e5e7eb;
    }
    #subtitle {
      position: fixed;
      left: 50%;
      bottom: 52px;
      transform: translateX(-50%);
      z-index: 30;
      max-width: 90vw;
      padding: 12px 18px;
      border-radius: 16px;
      background: rgba(0,0,0,0.62);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ffffff;
      font-size: 18px;
      line-height: 2;
      text-align: center;
      display: none;
      box-shadow: 0 12px 35px rgba(0,0,0,0.3);
    }
    #message {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      background: rgba(0,0,0,0.72);
      padding: 20px 24px;
      border-radius: 20px;
      color: white;
      font-size: 24px;
      text-align: center;
      display: none;
      max-width: 90vw;
    }
    #orientationWarn {
      position: fixed;
      inset: 0;
      background: rgba(5,8,22,0.96);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-size: 24px;
      line-height: 2;
      color: #fff;
    }
    @media (orientation: portrait) {
      #orientationWarn { display: flex; }
      #ui, #help, #subtitle, #message { filter: blur(0.2px); }
    }
  </style>
</head>
<body>
  <div id="orientationWarn">لطفاً گوشی را به صورت افقی نگه دار</div>

  <div id="ui">
    <h2>بازی ۳بعدی غمگین</h2>
    <div>جان: <span id="health">100</span></div>
    <div>امتیاز: <span id="score">0</span></div>
    <div>آیتم‌ها: <span id="items">0</span></div>
    <button onclick="restartGame()">شروع مجدد</button>
  </div>

  <div id="help">
    حرکت: W A S D<br>
    داستان با زیرنویس فارسی نمایش داده می‌شود.<br>
    از دشمن‌ها دوری کن و آیتم‌ها را جمع کن.
  </div>

  <div id="subtitle"></div>
  <div id="message"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene, camera, renderer, player, ground;
    let enemies = [];
    let collectibles = [];
    let keys = {};
    let health = 100;
    let score = 0;
    let itemCount = 0;
    let gameOver = false;
    let clock = new THREE.Clock();
    let subtitlesQueue = [];

    const healthEl = document.getElementById("health");
    const scoreEl = document.getElementById("score");
    const itemsEl = document.getElementById("items");
    const messageEl = document.getElementById("message");
    const subtitleEl = document.getElementById("subtitle");

    const storyLines = [
      "آن روز، آسمان دیگر آبی نبود...",
      "شهر در سکوتی سنگین فرو رفته بود.",
      "من و او، آخرین کسانی بودیم که هنوز امید را با خود حمل می‌کردیم.",
      "او گفت: اگر من برنگشتم، ادامه بده...",
      "اما من برگشتم، و او دیگر نبود.",
      "از آن لحظه به بعد، هر قدمم برای رسیدن به خاطره‌ای بود که دیگر وجود نداشت."
    ];

    init();
    startStory();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050816);
      scene.fog = new THREE.Fog(0x050816, 20, 130);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 7, 14);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      const ambient = new THREE.AmbientLight(0xffffff, 0.45);
      scene.add(ambient);

      const moonLight = new THREE.DirectionalLight(0x9ca3af, 0.9);
      moonLight.position.set(-12, 24, 10);
      moonLight.castShadow = true;
      scene.add(moonLight);

      const groundGeo = new THREE.PlaneGeometry(320, 320);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 1, metalness: 0 });
      ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // ruins / obstacles
      for (let i = 0; i < 35; i++) {
        const ruin = new THREE.Mesh(
          new THREE.BoxGeometry(
            rand(1.5, 6),
            rand(1.5, 8),
            rand(1.5, 6)
          ),
          new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 1 })
        );
        ruin.position.set(rand(-130, 130), ruin.geometry.parameters.height / 2, rand(-130, 130));
        ruin.rotation.y = rand(0, Math.PI);
        scene.add(ruin);
      }

      // dead trees
      for (let i = 0; i < 28; i++) {
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.35, 0.5, 4.2, 7),
          new THREE.MeshStandardMaterial({ color: 0x4b5563 })
        );
        trunk.position.set(rand(-135, 135), 2.1, rand(-135, 135));
        scene.add(trunk);

        const top = new THREE.Mesh(
          new THREE.SphereGeometry(1.5, 8, 8),
          new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 1 })
        );
        top.position.set(trunk.position.x, 4.4, trunk.position.z);
        scene.add(top);
      }

      // player
      const playerGeo = new THREE.BoxGeometry(1, 2, 1);
      const playerMat = new THREE.MeshStandardMaterial({ color: 0xf472b6, roughness: 0.7 });
      player = new THREE.Mesh(playerGeo, playerMat);
      player.position.set(0, 1, 0);
      player.castShadow = true;
      scene.add(player);

      spawnEnemies(10);
      spawnCollectibles(14);

      window.addEventListener("resize", onWindowResize);
      window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
      window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
    }

    function startStory() {
      let i = 0;
      subtitlesQueue = [...storyLines];
      showNextSubtitle();
      function showNextSubtitle() {
        if (i >= subtitlesQueue.length) {
          subtitleEl.style.display = "none";
          return;
        }
        subtitleEl.innerText = subtitlesQueue[i];
        subtitleEl.style.display = "block";
        i++;
        setTimeout(showNextSubtitle, 3500);
      }
    }

    function spawnEnemies(n) {
      for (let i = 0; i < n; i++) {
        const enemy = new THREE.Mesh(
          new THREE.BoxGeometry(1.2, 1.8, 1.2),
          new THREE.MeshStandardMaterial({ color: 0x7f1d1d, roughness: 1 })
        );
        enemy.position.set(rand(-110, 110), 0.9, rand(-110, 110));
        enemy.userData.speed = 0.55 + Math.random() * 0.75;
        scene.add(enemy);
        enemies.push(enemy);
      }
    }

    function spawnCollectibles(n) {
      for (let i = 0; i < n; i++) {
        const item = new THREE.Mesh(
          new THREE.SphereGeometry(0.45, 12, 12),
          new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0x553c06 })
        );
        item.position.set(rand(-120, 120), 0.5, rand(-120, 120));
        scene.add(item);
        collectibles.push(item);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (!gameOver && !isPortrait()) {
        movePlayer(delta);
        moveEnemies(delta);
        checkCollectibles();
        updateCamera();
      }

      renderer.render(scene, camera);
    }

    function movePlayer(delta) {
      const speed = 12 * delta;

      if (keys["w"]) player.position.z -= speed;
      if (keys["s"]) player.position.z += speed;
      if (keys["a"]) player.position.x -= speed;
      if (keys["d"]) player.position.x += speed;

      if (keys["w"]) player.rotation.y = Math.PI;
      if (keys["s"]) player.rotation.y = 0;
      if (keys["a"]) player.rotation.y = Math.PI / 2;
      if (keys["d"]) player.rotation.y = -Math.PI / 2;

      player.position.x = clamp(player.position.x, -145, 145);
      player.position.z = clamp(player.position.z, -145, 145);
    }

    function moveEnemies(delta) {
      enemies.forEach(enemy => {
        const dir = new THREE.Vector3().subVectors(player.position, enemy.position).normalize();
        enemy.position.addScaledVector(dir, enemy.userData.speed * delta);

        const dist = enemy.position.distanceTo(player.position);
        if (dist < 1.6) {
          health -= 18 * delta;
          health = Math.max(0, health);
          healthEl.innerText = Math.floor(health);
          if (health <= 0) endGame();
        }
      });
    }

    function checkCollectibles() {
      collectibles.forEach((item, index) => {
        if (!item) return;
        const dist = item.position.distanceTo(player.position);
        if (dist < 1.4) {
          scene.remove(item);
          collectibles[index] = null;
          score += 10;
          itemCount += 1;
          scoreEl.innerText = score;
          itemsEl.innerText = itemCount;
        }
      });

      if (itemCount >= 14 && !gameOver) {
        showMessage("او دیگر بازنمی‌گردد... اما تو هنوز زنده‌ای.");
        gameOver = true;
      }
    }

    function updateCamera() {
      const offset = new THREE.Vector3(0, 7, 14);
      const desiredPos = player.position.clone().add(offset);
      camera.position.lerp(desiredPos, 0.08);
      camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
    }

    function endGame() {
      gameOver = true;
      showMessage("پایان... سکوت، همه‌چیز را بلعید.");
    }

    function showMessage(text) {
      messageEl.innerText = text;
      messageEl.style.display = "block";
      setTimeout(() => {
        messageEl.style.display = "none";
      }, 4000);
    }

    function restartGame() {
      location.reload();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function isPortrait() {
      return window.innerHeight > window.innerWidth;
    }
  </script>
</body>
</html>
