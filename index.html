<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بازی داستانی - شبِ آخر</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #1b2340 0%, #0b1020 45%, #05070d 100%);
      color: #fff;
      user-select: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 34px 34px;
      opacity: .12;
      pointer-events: none;
    }

    .wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      width: min(900px, 96vw);
      min-height: min(620px, 92vh);
      border-radius: 24px;
      background: rgba(10, 14, 28, .72);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      backdrop-filter: blur(12px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .hero {
      height: 230px;
      position: relative;
      background:
        radial-gradient(circle at 20% 20%, rgba(120,180,255,.35), transparent 35%),
        radial-gradient(circle at 80% 30%, rgba(255,120,160,.2), transparent 28%),
        linear-gradient(180deg, #101a38 0%, #0c1227 55%, #080c18 100%);
    }

    .moon {
      position: absolute;
      top: 36px;
      right: 52px;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: #e7efff;
      box-shadow: 0 0 35px rgba(190,220,255,.35);
    }

    .moon::before {
      content: "";
      position: absolute;
      inset: 10px 18px 18px 10px;
      border-radius: 50%;
      background: rgba(205,220,255,.35);
    }

    .city {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 90px;
      background:
        linear-gradient(to top, rgba(0,0,0,.75), transparent),
        linear-gradient(90deg, #04060d 0 12%, #0a1120 12% 18%, #03050a 18% 26%, #0d1428 26% 34%, #05070c 34% 42%, #0a1020 42% 52%, #03050a 52% 61%, #10182f 61% 70%, #05070d 70% 79%, #0b1226 79% 88%, #04060b 88% 100%);
      clip-path: polygon(0 100%, 0 55%, 5% 55%, 5% 30%, 10% 30%, 10% 65%, 15% 65%, 15% 20%, 22% 20%, 22% 72%, 28% 72%, 28% 40%, 34% 40%, 34% 58%, 40% 58%, 40% 22%, 47% 22%, 47% 67%, 54% 67%, 54% 34%, 60% 34%, 60% 78%, 67% 78%, 67% 25%, 74% 25%, 74% 61%, 81% 61%, 81% 38%, 88% 38%, 88% 70%, 94% 70%, 94% 28%, 100% 28%, 100% 100%);
    }

    .content {
      flex: 1;
      padding: 22px 26px 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .title {
      font-size: 30px;
      font-weight: 800;
      margin: 0;
    }

    .sub {
      margin: 0;
      color: rgba(255,255,255,.75);
      line-height: 1.8;
      font-size: 15px;
    }

    .story {
      flex: 1;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 18px;
      line-height: 2.05;
      font-size: 17px;
      color: rgba(255,255,255,.95);
      overflow: auto;
      white-space: pre-line;
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    button {
      font-size: 15px;
      border: none;
      padding: 14px 16px;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(180deg, #2a4bff, #1730b8);
      cursor: pointer;
      transition: .2s;
      text-align: right;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: rgba(255,255,255,.7);
      font-size: 13px;
      flex-wrap: wrap;
    }

    .ghost {
      background: linear-gradient(180deg, #3a3f55, #24293a);
    }

    .danger {
      background: linear-gradient(180deg, #ff5a73, #c81f44);
    }

    .success {
      background: linear-gradient(180deg, #20c97f, #0d8b57);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="hero">
        <div class="moon"></div>
        <div class="city"></div>
      </div>

      <div class="content">
        <h1 class="title">شبِ آخر</h1>
        <p class="sub">یک بازی داستانی تعاملی با چند پایان مختلف</p>

        <div id="story" class="story"></div>

        <div id="choices" class="choices"></div>

        <div class="footer">
          <div>نکته: انتخاب‌ها داستان را تغییر می‌دهند</div>
          <div><button id="restart" class="ghost">شروع دوباره</button></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const storyEl = document.getElementById('story');
    const choicesEl = document.getElementById('choices');
    const restartBtn = document.getElementById('restart');

    const scenes = {
      start: {
        text: `ساعت ۲:۱۳ نیمه‌شب بود.
تو، «آراد»، در اتاق کوچکی در طبقه هفتم یک ساختمان قدیمی ایستاده‌ای.
امشب باید تصمیم بگیری: شهر را ترک کنی، یا برای پیدا کردن خواهر گمشده‌ات به دل تاریکی بروی.
از پنجره صدای آژیر از دور می‌آید و چراغ‌های خیابان یکی‌یکی خاموش می‌شوند.`,
        choices: [
          { text: 'از ساختمان خارج شوم و به خیابان بروم', next: 'street' },
          { text: 'در ساختمان بمانم و اتاق خواهرم را بگردم', next: 'room' }
        ]
      },
      street: {
        text: `پله‌ها را دوتا یکی پایین می‌روی.
در ورودی باز است. خیابان خیس از باران است و نور نئون مغازه‌ی بسته‌ای روی آسفالت می‌لرزد.
در دوردست، مردی با بارانی مشکی زیر چراغ ایستاده و انگار منتظر توست.`,
        choices: [
          { text: 'به سمت مرد ناشناس بروم', next: 'man' },
          { text: 'از کوچه‌ی کناری فرار کنم', next: 'alley' }
        ]
      },
      room: {
        text: `درِ اتاق خواهر کوچکت نیمه‌باز است.
روی میز یک دفترچه‌ی آبی پیدا می‌کنی. آخرین صفحه فقط یک جمله دارد:
"اگر امشب آمدند، به زیرزمین نرو."
همان لحظه صدای ضربه‌ای از پایین ساختمان می‌شنوی.`,
        choices: [
          { text: 'دفترچه را بردارم و به زیرزمین بروم', next: 'basement' },
          { text: 'دفترچه را بردارم و پنجره را برای فرار انتخاب کنم', next: 'roof' }
        ]
      },
      man: {
        text: `مرد ناشناس آرام سرش را بالا می‌آورد.
چهره‌اش را نمی‌بینی، اما صدایش آشناست:
"بالاخره آمدی، آراد. خواهرت اینجاست... ولی نه آن‌طور که فکر می‌کنی."
او یک کلید زنگ‌زده به دستت می‌دهد.`,
        choices: [
          { text: 'کلید را بگیرم و به انبار متروکه بروم', next: 'warehouse' },
          { text: 'به حرفش اعتماد نکنم و فرار کنم', next: 'alley' }
        ]
      },
      alley: {
        text: `در کوچه باریک می‌دوی.
دیوارها نم‌کشیده‌اند و صدای قدم‌هایت بین سطل‌های زباله می‌پیچد.
ناگهان یک در فلزی با علامت قرمز چشمک‌زن می‌بینی:
"دسترسی ممنوع - آزمایشگاه زیرزمینی"`,
        choices: [
          { text: 'در را باز کنم و وارد آزمایشگاه شوم', next: 'lab' },
          { text: 'دنبال راهی برای برگشتن به خیابان اصلی بگردم', next: 'street2' }
        ]
      },
      basement: {
        text: `پله‌های زیرزمین سرد و لغزان‌اند.
در پایین، اتاقی پر از مانیتورهای خاموش و کابل‌های قطع‌شده می‌بینی.
روی دیوار، با رنگ قرمز نوشته شده:
"خواهر تو در اینجا نبود. او در زمان دیگری گیر افتاده است."`,
        choices: [
          { text: 'سرنخ را دنبال کنم و دستگاه خاموش را روشن کنم', next: 'timeMachine' },
          { text: 'وحشت‌زده فرار کنم', next: 'endBad' }
        ]
      },
      roof: {
        text: `از پنجره بیرون می‌روی و روی لبه‌ی باریک پشت‌بام می‌ایستی.
باد شدید است. آن‌طرف‌تر، چراغ یک برج مخابراتی می‌درخشد.
روی زمین فلزی، علامتی دیده می‌شود که شبیه نقشه است.`,
        choices: [
          { text: 'به سمت برج بروم', next: 'tower' },
          { text: 'از راه اضطراری پایین برگردم', next: 'street' }
        ]
      },
      warehouse: {
        text: `انبار متروکه بوی روغن و فلز می‌دهد.
درون تاریکی، صدای دختر جوانی را می‌شنوی که می‌گوید:
"آراد؟"
اما وقتی چراغ‌قوه‌ات را روشن می‌کنی، فقط یک صندلی خالی و یک دستگاه قدیمی می‌بینی.
روی صفحه‌ی دستگاه: "انتخاب آخر".`,
        choices: [
          { text: 'دستگاه را فعال کنم', next: 'timeMachine' },
          { text: 'دنبال منبع صدا بگردم', next: 'endMystery' }
        ]
      },
      lab: {
        text: `در آزمایشگاه زیرزمینی، شیشه‌های شکسته و پرونده‌های پاره شده روی زمین پراکنده‌اند.
در مرکز اتاق، اتاقکی شیشه‌ای قرار دارد.
داخل آن... خواهر تو نیست.
فقط یک تصویر هولوگرافیک از او که می‌گوید:
"اگر این را دیدی، یعنی هنوز دیر نشده."`,
        choices: [
          { text: 'پیام را دنبال کنم و از تونل فرار کنم', next: 'timeMachine' },
          { text: 'اتاقک شیشه‌ای را بشکنم', next: 'endBad' }
        ]
      },
      street2: {
        text: `وقتی به خیابان برمی‌گردی، شهر عجیب‌تر شده است.
تابلوها خاموش‌اند و مردم انگار ناپدید شده‌اند.
فقط یک نور آبی از انتهای خیابان به تو علامت می‌دهد.`,
        choices: [
          { text: 'به نور آبی بروم', next: 'tower' },
          { text: 'پنهان شوم و صبر کنم', next: 'endNeutral' }
        ]
      },
      tower: {
        text: `برج مخابراتی مثل یک هیولا از دل مه بیرون آمده.
پای آن، دری باز است و صدای یک دستگاه در حال کار به گوش می‌رسد.
روی دیوار نوشته شده:
"تنها یک نفر می‌تواند از دروازه عبور کند."`,
        choices: [
          { text: 'خودم را برای عبور آماده کنم', next: 'timeMachine' },
          { text: 'برگردم و بیشتر فکر کنم', next: 'endNeutral' }
        ]
      },
      timeMachine: {
        text: `دستگاه روشن می‌شود و نور سفید همه‌جا را پر می‌کند.
تو صدای خواهرَت را می‌شنوی:
"آراد... من اینجام."
اما تنها راه نجات این است که یک انتخاب نهایی کنی:
بازگشت به گذشته یا بستن دروازه برای همیشه.`,
        choices: [
          { text: 'به گذشته بروم و او را نجات دهم', next: 'endGood' },
          { text: 'دروازه را ببندم و شهر را نجات دهم', next: 'endSacrifice' }
        ]
      },
      endGood: {
        text: `تو به گذشته می‌پری.
در لحظه‌ای کوتاه، خواهرَت را از حادثه نجات می‌دهی.
وقتی به زمان حال برمی‌گردی، او کنار تو ایستاده است.
شهر هنوز زخمی است، اما شما زنده‌اید.
پایان خوب.`,
        choices: [
          { text: 'دوباره بازی کن', next: 'start' }
        ]
      },
      endSacrifice: {
        text: `تو دروازه را می‌بندی.
نور خاموش می‌شود و سکوت همه‌جا را می‌گیرد.
خواهرَت از آن سوی شیشه برای همیشه از دست می‌رود، اما شهر نجات پیدا می‌کند.
اسم تو در هیچ‌جا ثبت نشد، اما بعضی قهرمان‌ها دیده نمی‌شوند.
پایان فداکارانه.`,
        choices: [
          { text: 'دوباره بازی کن', next: 'start' }
        ]
      },
      endBad: {
        text: `هوا سرد می‌شود.
نورها خاموش می‌شوند.
تو یک قدم اشتباه برداشتی و داستان در تاریکی فرو رفت.
پایان بد.`,
        choices: [
          { text: 'دوباره بازی کن', next: 'start' }
        ]
      },
      endMystery: {
        text: `دنبال صدا می‌گردی، اما فقط صدای قلب خودت را می‌شنوی.
وقتی برمی‌گردی، درِ انبار بسته شده و راه خروج ناپدید شده است.
بعضی رازها نباید دنبال شوند.
پایان مرموز.`,
        choices: [
          { text: 'دوباره بازی کن', next: 'start' }
        ]
      },
      endNeutral: {
        text: `تو صبر می‌کنی...
و شهر همان‌طور که هست، در مه گم می‌شود.
نه پیروزی، نه شکست؛ فقط یک فرصت از دست‌رفته.
پایان خنثی.`,
        choices: [
          { text: 'دوباره بازی کن', next: 'start' }
        ]
      }
    };

    function showScene(name) {
      const scene = scenes[name];
      storyEl.textContent = scene.text;
      choicesEl.innerHTML = '';
      scene.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.textContent = choice.text;
        btn.className = choice.next.startsWith('end') ? 'danger' : (choice.next === 'endGood' || choice.next === 'timeMachine' ? 'success' : '');
        btn.onclick = () => showScene(choice.next);
        choicesEl.appendChild(btn);
      });
    }

    restartBtn.onclick = () => showScene('start');

    showScene('start');
  </script>
  nima khaldi
</body>
</html>
