<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شبیه‌ساز - فرار سه کودک</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    canvas { width: 100vw; height: 100vh; display: block; }
    .ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: #fff;
    }
    .box {
      position: absolute;
      left: 16px;
      top: 16px;
      background: rgba(0,0,0,.42);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      padding: 12px 14px;
      backdrop-filter: blur(8px);
      max-width: min(520px, calc(100vw - 32px));
      line-height: 1.8;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .small {
      opacity: .85;
      font-size: 13px;
    }
    .center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .startCard {
      background: rgba(0,0,0,.58);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      padding: 24px 28px;
      max-width: 620px;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
    }
    .startCard h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }
    .startCard p {
      margin: 8px 0;
      line-height: 1.8;
      opacity: .92;
    }
    .btn {
      margin-top: 14px;
      pointer-events: auto;
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      color: #fff;
      background: linear-gradient(180deg, #ff4b6e, #a70f2d);
      cursor: pointer;
      font-size: 15px;
    }
    .hidden { display: none; }
    .scanlines::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.03) 0px,
        rgba(255,255,255,.03) 1px,
        transparent 2px,
        transparent 5px
      );
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: .18;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="ui scanlines">
    <div class="box">
      <div class="title">شبیه‌ساز روانی‌ساز</div>
      <div id="hud" class="small">در انتظار شروع...</div>
      <div id="chapter" class="small"></div>
    </div>

    <div class="center" id="overlay">
      <div class="startCard">
        <h1>فرار از شبیه‌ساز</h1>
        <p>سه کودک در یک محیط مصنوعی، تاریک و تغییرشکل‌دهنده گیر افتاده‌اند.</p>
        <p>این تجربه از یک فیلم/انیمیشن کوتاه الهام‌گرفته است و با صحنه‌های ترسناک و تنش روانی پیش می‌رود.</p>
        <p>برای شروع، روی دکمه زیر بزن.</p>
        <button class="btn" id="startBtn">شروع انیمیشن</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const chapterEl = document.getElementById('chapter');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');

    let W = innerWidth, H = innerHeight;
    canvas.width = W; canvas.height = H;
    addEventListener('resize', () => { W = innerWidth; H = innerHeight; canvas.width = W; canvas.height = H; });

    const scenes = [
      { t: 0, d: 12, chapter: "بخش ۱: بیدار شدن", text: "سکوت. نور فلورسنت. سه سایه در راهرویی بی‌انتها..." },
      { t: 12, d: 14, chapter: "بخش ۲: راهروهای دروغین", text: "دیوارها جابه‌جا می‌شوند. مسیرهای آشنا ناگهان ناپدید می‌شوند..." },
      { t: 26, d: 14, chapter: "بخش ۳: صدای تقلیدگر", text: "یک صدا از پشت سرشان می‌گوید: 'ایستید... من کمک می‌کنم...'" },
      { t: 40, d: 14, chapter: "بخش ۴: اتاق بازی", text: "اتاق کودکانه‌ای ظاهر می‌شود. اما اسباب‌بازی‌ها حرکت می‌کنند..." },
      { t: 54, d: 15, chapter: "بخش ۵: قطع ارتباط", text: "نور قرمز. آژیر. یکی از بچه‌ها گم می‌شود..." },
      { t: 69, d: 16, chapter: "بخش ۶: هسته مرکزی", text: "در مرکز شبیه‌ساز، چیزی بیدار می‌شود که نباید..." },
      { t: 85, d: 18, chapter: "بخش ۷: فرار نهایی", text: "دیوارها فرو می‌ریزند. فقط یک خروجی مانده..." },
      { t: 103, d: 12, chapter: "پایان: خاموشی", text: "آیا واقعاً فرار کردند؟ یا فقط از نسخه‌ای عمیق‌تر بیدار شدند؟" }
    ];

    const kids = [
      { name: "آرین", x: 0, y: 0, c: "#7dd3fc", fear: 0.1 },
      { name: "نورا", x: 0, y: 0, c: "#fda4af", fear: 0.1 },
      { name: "پارسا", x: 0, y: 0, c: "#c4b5fd", fear: 0.1 }
    ];

    let started = false;
    let startTime = 0;
    let flicker = 0;
    let glitch = 0;
    let shake = 0;

    function lerp(a,b,t){ return a + (b-a)*t; }
    function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
    function rand(a,b){ return Math.random()*(b-a)+a; }

    function currentScene(elapsed){
      return scenes.findLast(s => elapsed >= s.t) || scenes[0];
    }

    function drawBackground(t) {
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, '#0a0c10');
      g.addColorStop(0.55, '#050608');
      g.addColorStop(1, '#020203');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      const pulse = 0.25 + Math.sin(t*0.002)*0.06;
      const rg = ctx.createRadialGradient(W/2,H/2,40, W/2,H/2, Math.max(W,H)*0.7);
      rg.addColorStop(0, `rgba(120,180,255,${pulse})`);
      rg.addColorStop(0.45, 'rgba(60,80,120,.06)');
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(0,0,W,H);

      for (let i = 0; i < 70; i++) {
        const x = (i * 173 + t*0.03) % W;
        const y = (i * 97 + Math.sin(t*0.001+i)*40) % H;
        ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.03})`;
        ctx.fillRect(x,y,2,2);
      }

      if (Math.random() < 0.03) {
        ctx.fillStyle = 'rgba(255,0,60,.08)';
        ctx.fillRect(0,0,W,H);
      }
    }

    function drawHallway(t, scene) {
      const floorY = H*0.78;
      ctx.fillStyle = '#090a0d';
      ctx.fillRect(0, floorY, W, H-floorY);

      for (let i=0; i<14; i++) {
        const x = (W/2) + Math.sin(t*0.001 + i)*120;
        const y = H*0.12 + i*38 + Math.sin(t*0.002+i)*8;
        ctx.strokeStyle = `rgba(180,220,255,${0.05 + i*0.004})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x-220, y);
        ctx.lineTo(x+220, y);
        ctx.stroke();
      }

      const doorwayX = W/2 + Math.sin(t*0.0015)*160;
      ctx.fillStyle = 'rgba(255,255,255,.05)';
      ctx.fillRect(doorwayX-55, H*0.18, 110, H*0.52);
      ctx.strokeStyle = 'rgba(255,255,255,.12)';
      ctx.strokeRect(doorwayX-55, H*0.18, 110, H*0.52);

      if (scene.chapter.includes('مرکز')) {
        ctx.fillStyle = 'rgba(255,40,60,.12)';
        ctx.beginPath();
        ctx.arc(W/2, H*0.45, 160 + Math.sin(t*0.01)*8, 0, Math.PI*2);
        ctx.fill();
      }
    }

    function drawKid(kid, t, idx) {
      const baseY = H*0.74;
      const spacing = 100;
      kid.x = W/2 + (idx-1)*spacing + Math.sin(t*0.003 + idx)*18;
      kid.y = baseY + Math.sin(t*0.01 + idx)*3;

      const size = 26;
      ctx.save();
      ctx.translate(kid.x, kid.y);

      const fearShake = kid.fear * 8;
      ctx.translate(rand(-fearShake, fearShake), rand(-fearShake, fearShake));

      ctx.fillStyle = kid.c;
      ctx.beginPath();
      ctx.arc(0, -size*1.9, 12, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = '#111';
      ctx.fillRect(-10, -size*1.4, 20, 30);

      ctx.strokeStyle = 'rgba(255,255,255,.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-8, -size*1.2); ctx.lineTo(-18, -6);
      ctx.moveTo(8, -size*1.2); ctx.lineTo(18, -6);
      ctx.stroke();

      ctx.strokeStyle = '#222';
      ctx.beginPath();
      ctx.moveTo(-6, 10); ctx.lineTo(-10, 38);
      ctx.moveTo(6, 10); ctx.lineTo(10, 38);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath();
      ctx.arc(-4, -size*1.95, 2, 0, Math.PI*2);
      ctx.arc(4, -size*1.95, 2, 0, Math.PI*2);
      ctx.fill();

      ctx.restore();
    }

    function drawThreat(t, scene) {
      const x = W/2 + Math.sin(t*0.004)*260;
      const y = H*0.30 + Math.sin(t*0.006)*18;
      const size = 80 + Math.sin(t*0.02)*10;
      ctx.save();
      ctx.globalAlpha = 0.28 + 0.1*Math.sin(t*0.01);
      ctx.fillStyle = '#ff355e';
      ctx.beginPath();
      ctx.arc(x,y,size,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = '#ff6b81';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(x,y,size*0.65,0,Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    function drawGlitchBars(t) {
      if (Math.random() < 0.08) glitch = 1;
      glitch *= 0.92;
      if (glitch < 0.02) glitch = 0;

      if (glitch > 0) {
        for (let i = 0; i < 4; i++) {
          const y = rand(0, H);
          const h = rand(4, 24);
          ctx.fillStyle = `rgba(255,255,255,${0.08 * glitch})`;
          ctx.fillRect(rand(0,W*0.4), y, rand(W*0.3,W), h);
        }
      }
    }

    function updateHud(elapsed) {
      const scene = currentScene(elapsed);
      hud.textContent = scene.text;
      chapterEl.textContent = scene.chapter;
    }

    function render(t) {
      const elapsed = started ? (t - startTime) / 1000 : 0;
      const scene = currentScene(elapsed);

      drawBackground(t);
      drawHallway(t, scene);
      drawThreat(t, scene);

      kids.forEach((k, i) => {
        k.fear = clamp(k.fear + (scene.chapter.includes('مرکز') ? 0.01 : 0.003), 0.05, 1);
        drawKid(k, t, i);
      });

      drawGlitchBars(t);

      if (Math.random() < 0.015) shake = 10;
      shake *= 0.9;

      if (shake > 0.3) {
        ctx.save();
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = '#ff0022';
        ctx.fillRect(0,0,W,H);
        ctx.restore();
      }

      updateHud(elapsed);

      requestAnimationFrame(render);
    }

    startBtn.addEventListener('click', () => {
      overlay.classList.add('hidden');
      started = true;
      startTime = performance.now();
      hud.textContent = "شبیه‌ساز فعال شد...";
      chapterEl.textContent = "بخش ۱: بیدار شدن";
    });

    requestAnimationFrame(render);
  </script>
</body>
</html>
